# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind '!' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# don't rename windows automatically
set-option -g allow-rename off

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# Use extended keys
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Allow passthrough for LLM harness animations (e.g pbar)
set -g allow-passthrough on

# Copy mode
setw -g mode-keys vi

# enter copy mode with prefix + h instead of prefix + [
unbind '['
bind h copy-mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind P paste-buffer
# -p wraps the paste in bracketed-paste codes so the shell treats a trailing
# newline as text instead of running the line; -r keeps LF as LF (no CR swap)
bind v paste-buffer -pr
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel
