# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# split panes using | and -
bind '!' split-window -h -c "#{pane_current_path}"
bind '-' split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# switch panes using Alt-arrow without prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# don't rename windows automatically
set-option -g allow-rename off

# Enable mouse control (clickable windows, panes, resizable panes)
set -g mouse on
set -g focus-events on

# reload config file (change file location to your the tmux.conf you want to use)
bind r source-file ~/.tmux.conf

# Use extended keys
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Allow passthrough for LLM harness animations (e.g pbar)
set -g allow-passthrough on

# Copy mode
setw -g mode-keys vi

# enter copy mode with prefix + h instead of prefix + [
unbind '['
bind h copy-mode

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
bind P paste-buffer
# -p wraps the paste in bracketed-paste codes so the shell treats a trailing
# newline as text instead of running the line; -r keeps LF as LF (no CR swap)
bind v paste-buffer -pr
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel

# ===== GOLD THEME (palette from raphaelsimon.fr) =====
# bright gold #eec35e = "you are here / attention" : current window,
#   focused pane border, prefix pressed, messages
# deep gold   #c9a030 = background activity in another window
# grays               = everything else recedes

# true color for the outer terminal (Windows Terminal supports it)
set -as terminal-features 'xterm-256color:RGB'

# status bar: transparent background, quiet gray text
set -g status-style 'fg=#9a9a9a,bg=default'
set -g status-left-length 30
# session name: gold text; turns into a gold pill while prefix is held
set -g status-left '#{?client_prefix,#[fg=#1a1a1a bg=#eec35e bold],#[fg=#eec35e bold]} #S #[default] '
set -g status-right '#[fg=#6e6e6e]%d %b  %H:%M '

# windows: gray entries, one gold pill for the current window
set -g window-status-format '#[fg=#8b8b8b] #I #W '
set -g window-status-current-format '#[fg=#1a1a1a bg=#eec35e bold] #I #W #[default]'
set -g window-status-separator ''
setw -g window-status-activity-style 'fg=#c9a030'
setw -g window-status-bell-style 'fg=#c9a030,bold'

# pane borders: whisper gray, gold thread for the focused pane
set -g pane-border-style 'fg=#3a3a3a'
set -g pane-active-border-style 'fg=#eec35e'

# transient surfaces: gold fill = look here, briefly
set -g message-style 'bg=#eec35e,fg=#1a1a1a,bold'
set -g message-command-style 'bg=#eec35e,fg=#1a1a1a,bold'
set -g mode-style 'bg=#eec35e,fg=#1a1a1a,bold'
setw -g clock-mode-colour '#eec35e'
set -g display-panes-active-colour '#eec35e'
set -g display-panes-colour '#6e6e6e'
# ===== END GOLD THEME =====
